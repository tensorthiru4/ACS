# Build, test, scan and deploy the orchestrator.
#   gcloud builds submit --config cloudbuild/orchestrator.yaml \
#     --substitutions=_REGION=us-central1,SHORT_SHA=$(git rev-parse --short HEAD) .
substitutions:
  _REGION: us-central1
  _REPO: acs
  _SERVICE: acs-orchestrator
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/orchestrator:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
  # No machineType: the free 2,500 build-minutes cover only the default e2-standard-2.
  # SHORT_SHA and _REPO are only referenced inside _IMAGE, which strict matching rejects.
  substitutionOption: ALLOW_LOOSE
  # _IMAGE is built from other substitutions; expand them.
  dynamicSubstitutions: true

steps:
  - id: test
    name: ghcr.io/astral-sh/uv:0.9.26-python3.12-bookworm-slim
    dir: services/orchestrator
    entrypoint: bash
    args:
      - -ceu
      - |
        uv sync --frozen
        uv run ruff check src tests
        uv run pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "services/orchestrator"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  # Fail the build on fixable HIGH/CRITICAL OS or library vulnerabilities.
  - id: scan
    name: aquasec/trivy:0.58.1
    args: ["image", "--exit-code", "1", "--severity", "HIGH,CRITICAL", "--ignore-unfixed",
           "--scanners", "vuln", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        # $$ escapes bash expansions from Cloud Build substitution. Deploy by digest.
        IMG="${_IMAGE}"
        DIGEST=$$(gcloud artifacts docker images describe "$$IMG" --format='value(image_summary.digest)')
        if ! gcloud run services describe "${_SERVICE}" --region "${_REGION}" >/dev/null 2>&1; then
          echo "Service not created yet; terraform apply will create it with:"
          echo "  orchestrator_image = \"$${IMG%:*}@$${DIGEST}\""
          exit 0
        fi
        gcloud run deploy "${_SERVICE}" --region "${_REGION}" \
          --image "$${IMG%:*}@$${DIGEST}" --no-allow-unauthenticated --quiet

images:
  - ${_IMAGE}
