name: orchestrator

on:
  pull_request:
    paths: ["services/orchestrator/**", "infra/**", ".github/workflows/orchestrator.yml"]
  push:
    branches: [main]
    paths: ["services/orchestrator/**", "cloudbuild/**", ".github/workflows/orchestrator.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, terraform]
    runs-on: ubuntu-latest
    environment: production # require reviewer approval in repo settings
    permissions:
      contents: read
      id-token: write # keyless auth via Workload Identity Federation (no JSON keys)
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: >
          gcloud builds submit --project "${{ vars.GCP_PROJECT_ID }}"
          --config cloudbuild/orchestrator.yaml
          --substitutions=SHORT_SHA=${GITHUB_SHA::7} .
