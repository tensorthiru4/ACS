[project]
name = "acs-rule-engine"
version = "0.1.0"
description = "ACS Deterministic Rule Engine: pure CEL evaluation of merchant rule sets on Cloud Run. No LLM."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "acs-common[rules,web]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-cloud-firestore>=2.19",
    "cachetools>=5.5",
]

[tool.uv.sources]
acs-common = { path = "../../libs/acs_common", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acs_rule_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
