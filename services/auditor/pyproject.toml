[project]
name = "acs-auditor"
version = "0.1.0"
description = "ACS Agent-Readiness Auditor: Playwright journeys against a storefront's UCP surface, scored deterministically, fixes by Gemini Flash (A2A)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "acs-common[gemini,a2a,web]",
    "a2a-sdk[http-server]>=1.2,<2",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "playwright>=1.55,<2",
    "google-cloud-firestore>=2.19",
    "google-cloud-bigquery>=3.27",
    "google-cloud-tasks>=2.18",
]

[tool.uv.sources]
acs-common = { path = "../../libs/acs_common", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acs_auditor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
